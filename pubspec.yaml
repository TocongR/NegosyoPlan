name: negosyoplan
description: >-
  NegosyoPlan — offline mobile app that helps MSME owners in Iloilo prepare
  their EMBRACE loan papers (Annex A, C and D) and type their yearly financial
  statements. Includes an OLEDIPO staff dashboard.
publish_to: 'none'
version: 0.4.0+4

environment:
  # Flutter 3.22+ (Dart 3.4+) — uses WidgetStateProperty.
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  archive: ^3.6.1
  share_plus: ^10.1.4
  # Requirement PDFs: picked from the phone, listed in SQLite, files kept in the app's folder.
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  # Online demo backend: answers to Firestore, PDFs to Google Drive (via Apps Script + http).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/templates/
    - assets/forms/
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    # Fallback for glyphs Atkinson Hyperlegible lacks (₱, ✓). Also used in PDFs.
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
